server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El navegador llama a /api/... y nginx lo reenvía al backend dentro de la red de Compose.
    # Así el frontend no necesita conocer la dirección del backend ni hace falta CORS.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
